services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=gtowizard
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  solver_daemon:
    build:
      context: ./solver_daemon
      dockerfile: Dockerfile
    volumes:
      # Mount the whole release *directory* rather than the single binary file:
      # `cargo build` replaces the binary (new inode), and a single-file bind
      # mount stays pinned to the old inode, so the container would silently
      # keep running a stale solver. With a directory mount the container
      # always sees the current binary after a restart.
      - ./solver_daemon/target/release:/app/release:ro
      - ./ml/artifacts:/app/artifacts:ro
    command: ["/app/release/solver_daemon"]
    ports:
      - "9998:9998"
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gtowizard
      - SOLVER_DAEMON_HOST=solver_daemon
      - SOLVER_DAEMON_PORT=9998
      - DEBUG=True
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost:8089,http://45.81.4.169.sslip.io,http://gtowizard.2d5104a9.sslip.io,http://zenosolver.2d5104a9.sslip.io,http://gto.2d5104a9.sslip.io,http://2d5104a9.sslip.io,http://45.81.4.169
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-Player1_Poker2026!}
      - NORMAL_USER_PASSWORD=${NORMAL_USER_PASSWORD:-Player1_Poker2026!}
    depends_on:
      db:
        condition: service_healthy
      solver_daemon:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    command: >
      sh -c "
        python manage.py makemigrations &&
        python manage.py migrate &&
        python seed.py &&
        python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_URL=/api
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    ports:
      - "8089:8089"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8089/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2.7-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
